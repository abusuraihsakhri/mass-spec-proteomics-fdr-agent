[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-spec-proteomics-fdr-agent"
version = "2.0.0"
description = "ProteoFDR: Target-Decoy Search & Peptide-Spectrum Match (PSM) Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3", "fastapi>=0.110,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mass-spec-proteomics-fdr-engine = "proteomics_fdr.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/mass-spec-proteomics-fdr-agent"
Repository = "https://github.com/abusuraihsakhri/mass-spec-proteomics-fdr-agent.git"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "proteomics_fdr_app"]

[tool.setuptools.packages.find]
include = ["agents*", "proteomics_fdr*"]
