name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure ephemeral test signing key
        run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Install and check package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
          python -m compileall -q agents proteomics_fdr cli.py enrichment.py
      - name: Test
        run: python -m pytest -q
      - name: Verify web JavaScript syntax
        run: node --check web/app.js
      - name: Test browser algorithm
        run: node --test tests/test_web_fdr.cjs
      - name: Check audit verifier
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
